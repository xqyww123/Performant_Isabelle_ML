# Release this repo as the conda package `isabelle-performant-ml` on
# https://conda.qiyuan.me.
#
# This repo owns its own release: bump ./VERSION, push a `v*` tag, done.  The only thing
# it does not own is the R2 publish step, which is shared with every other Isabelle conda
# package via a reusable workflow in xqyww123/isabelle-packaging-ci -- so the
# channel-indexing rules exist in exactly one place.
#
# The R2 CREDENTIALS cannot be centralised the same way: a reusable workflow receives the
# CALLING repo's secrets, and a personal account has no org-level secrets.  They must be
# set on THIS repo (see the `publish` job below) and are passed explicitly, never with
# `secrets: inherit`.
#
# The package is not pure source: it also carries the native library
# libperformant_isabelle_ml for all five supported platforms.  Those cannot be compiled at
# install time (conda runs no compiler in a user's env) and cannot be compiled in the
# `build` job either (one runner is one architecture), so the `native` job below compiles
# each on a runner of its own architecture and `build` collects the five artifacts before
# rattler-build runs.  The package itself stays `noarch: generic`: ONE artifact carrying
# all five, exactly as Isabelle ships its own libsha1.so, because library/thread_cpu.ML
# picks the directory for the RUNNING platform at run time.
name: release-conda

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only -- do NOT publish to the channel"
        type: boolean
        default: false
      build_number:
        description: "conda build number - BUMP if republishing the same VERSION with changed content"
        type: string
        default: "0"
  push:
    tags: ['v*']

# Two releases of THIS package must never overlap.  (Overlap with a DIFFERENT package's
# release is handled in publish-conda.yml, which can only ever add to the channel.)
concurrency:
  group: release-conda
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------
  # The native half of the session.  library/native/build TARGET compiles
  # libperformant_isabelle_ml from library/native/*.c, checks the freshly linked file
  # (see library/native/README), and only then installs it as library/native/TARGET/ --
  # libperformant_isabelle_ml.so everywhere, performant_isabelle_ml.dll on Windows.
  # (The .so suffix on macOS is deliberate, not an oversight: library/thread_cpu.ML
  # asks for that exact name on every non-Windows platform.)
  #
  # THE GATE IS THE SELF-TEST.  The script exits nonzero when it fails and leaves the
  # installed library untouched, so a broken platform reddens its own leg here rather
  # than reaching a user.  x86_64-windows is the one exception: the POSIX self-test
  # cannot run there, so the script checks the staged DLL statically instead -- a
  # 64-bit PE exporting the three entry points.  That leg therefore proves the staged
  # file is a 64-bit PE whose export table names the three entry points -- not that it
  # loads, and not that it returns correct times; nothing in this workflow loads the
  # Windows DLL.  Windows behaviour is covered by the measurements in
  # ai-artifacts/THREAD_CPU_MEASUREMENTS.md.
  #
  # TARGET is Poly/ML's ML_PLATFORM with any compact-object "_32" stripped from the
  # architecture, which is precisely the directory name library/thread_cpu.ML computes
  # at run time -- so the artifact names here, the directory names in the package, and
  # the lookup in ML are all the same five strings.
  # ---------------------------------------------------------------------------------
  native:
    name: "Native library: ${{ matrix.target }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # Report every platform.  With fail-fast the first red leg cancels the rest, and
      # the interesting question after a failure is always "which of the five?".
      fail-fast: false
      matrix:
        include:
          - target: arm64-darwin
            runner: macos-14          # Apple silicon
            shell: bash
          - target: x86_64-darwin
            runner: macos-15-intel    # The only remaining Intel macOS image.  Do NOT
                                      # use macos-13: it is retired, and a job assigned
                                      # to it never starts, never errors and never
                                      # annotates -- it just queues forever.
            shell: bash
          - target: arm64-linux
            runner: ubuntu-24.04-arm
            shell: bash
          - target: x86_64-linux
            runner: ubuntu-latest
            shell: bash
          - target: x86_64-windows
            runner: windows-latest
            # msys2/setup-msys2 below installs mingw-w64-x86_64-gcc, which is what puts
            # gcc under /mingw64/bin -- the exact directory library/native/build prepends
            # to PATH for this target.
            shell: msys2 {0}
    defaults:
      run:
        # Matrix-driven because only the Windows leg needs the msys2 shell.  It has to
        # live HERE: `jobs.<id>.defaults.run` is one of the few keys where GitHub
        # evaluates the matrix context, while a step-level `shell:` does not accept an
        # expression at all.
        shell: ${{ matrix.shell }}
    steps:
      # Git for Windows checks out text files with CRLF.  bash then reads the trailing
      # \r as part of the last word on every line, so library/native/build would set
      # e.g. sources to "thread_cpu.c<CR>" and fail in ways that read like a compiler
      # problem.  Unconditional rather than guarded: it is a no-op on the unix runners,
      # and a condition here would be one more thing that can silently stop matching.
      # `shell: bash` explicitly -- this runs BEFORE setup-msys2, so on Windows it is
      # Git-Bash; the job default would name a shell that does not exist yet.
      - name: "Check out with LF line endings, not CRLF"
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        if: matrix.target == 'x86_64-windows'
        with:
          msystem: MINGW64
          update: false
          # binutils explicitly: library/native/build inspects the staged DLL with
          # objdump on this target (its stand-in for the self-test it cannot run), and
          # a tool that arrives only as a gcc dependency can silently stop arriving.
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      # Which compiler actually answered to `gcc` is the first thing anyone wants from a
      # failed log -- clang behind the name on macOS, mingw64 gcc on Windows.
      - name: Machine
        run: |
          uname -a
          which gcc
          gcc --version

      - name: "Compile, check and install library/native/${{ matrix.target }}/"
        run: |
          set -euo pipefail
          # `bash <script>` rather than `./<script>`: the executable bit is not worth
          # depending on, least of all across a Windows checkout.  The script cds to
          # its own directory, so the relative path is all it needs.
          bash library/native/build "${{ matrix.target }}"
          echo "===== installed ====="
          ls -l "library/native/${{ matrix.target }}"

      - name: "The file produced is the one library/thread_cpu.ML will look for"
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-windows) want="performant_isabelle_ml.dll" ;;
            *)              want="libperformant_isabelle_ml.so" ;;
          esac
          f="library/native/${{ matrix.target }}/$want"
          [ -f "$f" ] || { echo "::error::$f was not produced"; exit 1; }
          # The target name is what library/thread_cpu.ML computes from ML_PLATFORM at
          # run time, so the bytes under it must be for that architecture.
          # library/native/build's check only proves the file is sound HERE; this
          # proves "here" is the architecture the name promises.  Skipped when CC is
          # set, which is how a deliberate cross
          # build announces itself (library/native/build honours CC/LD).
          if [ -z "${CC:-}" ]; then
            arch="${{ matrix.target }}"; arch="${arch%%-*}"
            case "$arch:$(uname -m)" in
              x86_64:x86_64 | arm64:arm64 | arm64:aarch64) ;;
              *) echo "::error::target ${{ matrix.target }} built on a $(uname -m) runner"; exit 1 ;;
            esac
          fi
          # Informational only -- `file` is absent from some msys2 installs.
          file "$f" || true
          # The floors the artifact actually carries, so the CHANGELOG can quote a
          # log rather than a recollection: the highest glibc symbol version on
          # Linux, the stamped minimum macOS on darwin.
          case "${{ matrix.target }}" in
            *-linux)  echo "glibc floor of this artifact: $(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)" ;;
            *-darwin) otool -l "$f" | grep -A3 LC_BUILD_VERSION || true ;;
          esac
          echo "  OK  $f"

      - uses: actions/upload-artifact@v4
        with:
          # The `build` job strips this `native-` prefix back off to recover the target
          # directory name; keep the two spellings in step.
          name: native-${{ matrix.target }}
          path: library/native/${{ matrix.target }}/
          if-no-files-found: error

  build:
    name: "Build isabelle-performant-ml (noarch)"
    # The five native libraries are INPUTS to the package, not a parallel product: the
    # recipe refuses to build without them (see conda/recipe.yaml).
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Readme.md and the two SKILL.md are one document kept as three files by hand (an
      # agent reads the skill copies, a person reads the Readme).  They have drifted
      # before; a release must not carry a skill that contradicts the Readme.
      - name: "The three copies of the index are one document"
        run: |
          set -euo pipefail
          diff -q Readme.md SKILL.md
          diff -q Readme.md .claude/skills/performant-isabelle-ml/SKILL.md

      - name: "Read the version from ./VERSION"
        id: ver
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < VERSION)"
          # conda versions may not contain '-'; catch a bad VERSION here rather than in a
          # confusing rattler-build error.
          case "$v" in
            ''|*-*) echo "::error::VERSION is '$v' -- must be non-empty and contain no '-'"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building isabelle-performant-ml $v"

      - name: "The tag must agree with ./VERSION"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          [ "$tag" = "${{ steps.ver.outputs.version }}" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION=${{ steps.ver.outputs.version }}"
            exit 1; }

          # `concurrency: release-conda` above holds at most ONE pending run: pushing
          # several accumulated tags at once (git push --tags) makes each new pending run
          # supersede the previous one, so every tag but the first and the last is
          # dropped -- and a superseded run renders grey, not red, so nothing notifies.
          # Refuse to pass quietly in that state.  Do NOT "fix" it by keying the
          # concurrency group on github.ref: that would let two releases of this package
          # publish concurrently, which is exactly what the group exists to prevent.
          git fetch --tags --force --quiet
          newest="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          [ "$newest" = "$GITHUB_REF_NAME" ] || {
            echo "::error::$GITHUB_REF_NAME is not the newest v* tag (newest is $newest)."
            echo "          Releases are serialised, so pushing several tags at once drops"
            echo "          the middle ones.  Release one tag at a time, then re-run this."
            exit 1; }

      # ---------------------------------------------------------------------------
      # Put the five prebuilt libraries where the recipe expects them: exactly the
      # library/native/<target>/ layout of a developer's own `library/native/build`
      # run, so the recipe copies `library/` wholesale and neither knows nor cares
      # that CI assembled it.  This MUST come after actions/checkout, which cleans
      # the workspace of anything it did not put there.
      # ---------------------------------------------------------------------------
      - name: "Collect the native libraries built by the `native` job"
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native

      - name: "Move them into library/native/<target>/"
        run: |
          set -euo pipefail
          # Without `merge-multiple: true` each artifact keeps its own subdirectory:
          # $RUNNER_TEMP/native/native-<target>/<library file>.  That separation is the
          # point -- the five files share only two distinct basenames -- so recover the
          # target name by stripping the `native-` prefix the upload added.
          for d in "$RUNNER_TEMP"/native/native-*; do
            t="$(basename "$d")"; t="${t#native-}"
            mkdir -p "library/native/$t"
            cp -a "$d/." "library/native/$t/"
          done
          echo "===== library/native ====="
          find library/native -mindepth 2 -type f -printf '  %10s  %p\n' | sort -k2

      - name: "All five must be present -- a package without them is worse than no package"
        run: |
          set -euo pipefail
          # A user's Isabelle finds the library by platform at run time and errors out
          # naming library/native/build when it is absent.  Shipping a package that is
          # silently missing one platform would turn a clear "not built" message into a
          # "you installed the package and it still does not work".  So: hard gate, and
          # list every offender instead of dying on the first.
          #
          # macOS uses the .so suffix too -- that is what library/thread_cpu.ML asks for
          # on every non-Windows platform, so the build script never emits a .dylib.
          missing=0
          for f in \
            library/native/arm64-darwin/libperformant_isabelle_ml.so \
            library/native/arm64-linux/libperformant_isabelle_ml.so \
            library/native/x86_64-darwin/libperformant_isabelle_ml.so \
            library/native/x86_64-linux/libperformant_isabelle_ml.so \
            library/native/x86_64-windows/performant_isabelle_ml.dll ; do
            if [ -f "$f" ]; then echo "  OK  $f"; else echo "::error::missing $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Install rattler-build
        run: |
          set -euo pipefail
          # Downloaded directly: installing it through conda goes via a proxy that
          # intercepts conda-forge and fails TLS.
          curl -fsSL -o /tmp/rattler-build \
            https://github.com/prefix-dev/rattler-build/releases/download/v0.69.1/rattler-build-x86_64-unknown-linux-musl
          chmod +x /tmp/rattler-build
          /tmp/rattler-build --version

      - name: Build the package
        env:
          ISA_COMPONENT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          /tmp/rattler-build build \
            --recipe conda/recipe.yaml \
            --output-dir "$GITHUB_WORKSPACE/out" \
            --build-num "${{ inputs.build_number || '0' }}" \
            --no-test
          echo "===== built ====="
          find "$GITHUB_WORKSPACE/out" -name '*.conda' -printf '  %10s  %p\n'

      - name: "Sanity: the package really contains the session, the native libraries and BOTH hook sets"
        run: |
          set -euo pipefail
          pkg=$(find "$GITHUB_WORKSPACE/out" -name 'isabelle-performant-ml-*.conda' | head -1)
          [ -n "$pkg" ] || { echo "::error::no package was produced"; exit 1; }

          # A .conda is a zip of two zstd tarballs, so listing the zip alone only shows
          # ['metadata.json', 'pkg-*.tar.zst', 'info-*.tar.zst'] and proves nothing.
          # Extract the payload and assert the files that actually matter -- above all the
          # Windows .bat hooks, which no linux smoke test can ever exercise.
          pip install --quiet zstandard
          work=$(mktemp -d)
          # One line on purpose: a heredoc body would have to sit at column 0 to keep
          # its terminator recognisable, and column 0 ends this YAML block scalar.
          python3 -c "import sys,zipfile,tarfile,io,zstandard; z=zipfile.ZipFile(sys.argv[1]); b=next(n for n in z.namelist() if n.startswith('pkg-') and n.endswith('.tar.zst')); r=zstandard.ZstdDecompressor().stream_reader(io.BytesIO(z.read(b))); tarfile.open(fileobj=io.BytesIO(r.read())).extractall(sys.argv[2])" "$pkg" "$work"
          echo "===== payload ====="
          find "$work" -maxdepth 3 | sort

          # The five native libraries are asserted HERE as well as in the recipe: the
          # recipe proves they reached $PREFIX, this proves they survived into the
          # shipped payload.  They are gitignored, so the recipe carries
          # `use_gitignore: false` to get them past rattler-build's source copy at all --
          # a setting that is easy to lose in an edit, and whose loss a user's first
          # `Thread_CPU` call need not report at all: without the library the clock
          # is simply absent.
          for want in \
            share/isabelle-performant-ml/ROOT \
            share/isabelle-performant-ml/Performant_Isabelle_ML.thy \
            share/isabelle-performant-ml/HOL/SSymb.thy \
            share/isabelle-performant-ml/library/native/arm64-darwin/libperformant_isabelle_ml.so \
            share/isabelle-performant-ml/library/native/arm64-linux/libperformant_isabelle_ml.so \
            share/isabelle-performant-ml/library/native/x86_64-darwin/libperformant_isabelle_ml.so \
            share/isabelle-performant-ml/library/native/x86_64-linux/libperformant_isabelle_ml.so \
            share/isabelle-performant-ml/library/native/x86_64-windows/performant_isabelle_ml.dll \
            bin/.isabelle-performant-ml-post-link.sh \
            bin/.isabelle-performant-ml-pre-unlink.sh \
            Scripts/.isabelle-performant-ml-post-link.bat \
            Scripts/.isabelle-performant-ml-pre-unlink.bat ; do
            [ -e "$work/$want" ] || { echo "::error::missing from the package: $want"; exit 1; }
            echo "  OK  $want"
          done

          # The hooks address the component by a path literal; a divergence from where the
          # files were actually installed builds and installs green and dies later as an
          # unknown session.  Assert the two agree.
          grep -qF 'share/isabelle-performant-ml' "$work/bin/.isabelle-performant-ml-post-link.sh" \
            || { echo "::error::post-link.sh does not point at the shipped directory"; exit 1; }
          grep -qF 'share\isabelle-performant-ml' "$work/Scripts/.isabelle-performant-ml-post-link.bat" \
            || { echo "::error::post-link.bat does not point at the shipped directory"; exit 1; }
          # ...and the .bat must be CRLF, or cmd.exe mis-parses it.
          grep -qU $'\r' "$work/Scripts/.isabelle-performant-ml-post-link.bat" \
            || { echo "::error::post-link.bat is not CRLF"; exit 1; }
          echo "  OK  hook path literals agree with the install location; .bat is CRLF"

      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages
          path: out/**/*.conda
          if-no-files-found: error

  # Install and USE the package BEFORE it is published.  Publishing is the point of no
  # return: publish-conda.yml uploads first and the channel never deletes, so a package
  # with a broken post-link would become the newest resolvable version and stay broken
  # until someone hand-deletes the object from R2.  The base repo already gates its
  # release this way (build.yml Job F installs from a file:// channel); this is the
  # component-repo equivalent.
  verify:
    name: "Verify before publishing: install + build the session"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: conda-packages
          path: ${{ runner.temp }}/pkgs

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Index the freshly built package into a local channel
        run: |
          set -euo pipefail
          conda install -y -n base -c conda-forge conda-index -q
          CH="$RUNNER_TEMP/local-channel"
          mkdir -p "$CH/noarch"
          find "$RUNNER_TEMP/pkgs" -name '*.conda' -exec cp {} "$CH/noarch/" \;
          # $CONDA/bin/python, not bare `python`: setup-miniconda leaves /usr/bin/python
          # first on PATH, and conda-index was just installed into the BASE env.
          # publish-conda.yml already spells it this way; these two must agree.
          "$CONDA/bin/python" -m conda_index "$CH" --no-zst --no-bz2 --channeldata --channel-name local
          echo "CH=$CH" >> "$GITHUB_ENV"
          ls -l "$CH/noarch/"

      - name: "Install it -- local channel for US, conda.qiyuan.me for the base isabelle"
        run: |
          set -euo pipefail
          # Unlike the base repo we have no local `isabelle` artifact to solve against, so
          # the run dependency comes from the published channel while the package under
          # test comes from the local one.  --override-channels keeps conda-forge (which
          # this stack needs nothing from) out of a proxy that breaks TLS here.
          conda create -y -n v \
            -c "file://$CH" -c https://conda.qiyuan.me --override-channels \
            isabelle-performant-ml
          conda activate v
          conda list isabelle

      - name: "The post-link registered it"
        run: |
          set -euo pipefail
          conda activate v
          comp="$(isabelle getenv -b ISABELLE_HOME_USER)/etc/components"
          cat "$comp"
          grep -q 'isabelle-performant-ml' "$comp" \
            || { echo "::error::post-link did not register the component"; exit 1; }

      - name: "...and the session builds"
        run: |
          set -euo pipefail
          conda activate v
          isabelle build -v Performant_Isabelle_ML Performant_Isabelle_HOL

      # Building the session proves nothing about the native library: thread_cpu.ML
      # loads it lazily (Foreign.loadLibraryIndirect), so the path is never resolved
      # until a Thread_CPU call.  This is the one step in the pipeline that makes such
      # a call against the INSTALLED component, i.e. the one that checks the identity
      # everything else assumes -- the directory CI wrote is the one ML looks in.  The
      # import is session-qualified: a bare name would make Isabelle look for a local
      # .thy of that name.
      - name: "...and the shipped native library loads from ML"
        run: |
          set -euo pipefail
          conda activate v
          chk="$RUNNER_TEMP/chk"; mkdir -p "$chk"
          printf '%s\n' 'session Check_Native = Performant_Isabelle_ML + theories Check_Native' > "$chk/ROOT"
          printf '%s\n' \
            'theory Check_Native' \
            '  imports "Performant_Isabelle_ML.Performant_Isabelle_ML"' \
            'begin' \
            'ML \<open>' \
            '  val clock = Thread_CPU.the_self ();' \
            '  val t = (case Thread_CPU.read clock of SOME t => t | NONE => error "own clock unreadable");' \
            '  val _ = Thread_CPU.free clock;' \
            '  val _ = writeln ("thread CPU read from the shipped library: " ^ Time.toString t)' \
            '\<close>' \
            'end' > "$chk/Check_Native.thy"
          isabelle build -d "$chk" -v Check_Native

  publish:
    needs: verify
    # A dry run stops here: build and verify have already proved the package is
    # sound, and publishing is the irreversible step (bytes go up before the index
    # is rebuilt, and a published name may never be reused).  `smoke` needs this
    # job, and a skipped `needs` skips the dependant too, so both drop out.
    #
    # Empty on a tag push -- `!''` is true -- so a real release is unaffected.
    if: ${{ !inputs.dry_run }}
    uses: xqyww123/isabelle-packaging-ci/.github/workflows/publish-conda.yml@main
    with:
      artifact: conda-packages
      package_name: isabelle-performant-ml
    # Passed explicitly, NOT `inherit`.  A reusable workflow receives the CALLING repo's
    # secrets, and `inherit` silently forwards empty strings when this repo has none --
    # while also disabling publish-conda.yml's `required: true` checks.  Naming them makes
    # an unseeded repo fail at workflow-resolution time with the secret's name in the
    # error.  Seed them with:
    #   gh secret set CONDA_R2_ACCESS_KEY_ID     -R xqyww123/Performant_Isabelle_ML
    #   gh secret set CONDA_R2_SECRET_ACCESS_KEY -R xqyww123/Performant_Isabelle_ML
    secrets:
      CONDA_R2_ACCESS_KEY_ID:     ${{ secrets.CONDA_R2_ACCESS_KEY_ID }}
      CONDA_R2_SECRET_ACCESS_KEY: ${{ secrets.CONDA_R2_SECRET_ACCESS_KEY }}

  # The only test that means anything: install it the way a user does, and BUILD the
  # session against the base `isabelle` package.  That exercises the post-link
  # registration (`isabelle components -u`) end to end -- if registration silently did
  # nothing, the session is unknown and this reddens.
  # Installs the way a user does, from the live channel, and asserts the two things
  # that fail SILENTLY: that the post-link registered the component, and that the
  # pre-unlink unregistered it again.  Both legs matter -- a Windows registration
  # failure is invisible (install succeeds, `conda list` shows it, nothing is
  # registered), which is exactly how the Cygwin cold-start bug hid for so long.
  # This logic was validated against the live channel first, by
  # isabelle-packaging-ci's smoke-logic-probe.
  smoke:
    name: "Smoke: conda install from conda.qiyuan.me (${{ matrix.os }})"
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # bash -l (LOGIN shell): without it the Windows runner's Git-Bash starts
        # --noprofile --norc and conda is not on PATH at all.
        shell: bash -l {0}
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: "conda install -c https://conda.qiyuan.me isabelle-performant-ml"
        run: |
          set -euo pipefail
          conda create -y -n t \
            -c https://conda.qiyuan.me --override-channels \
            isabelle-performant-ml
          conda activate t
          conda list isabelle-performant-ml

      - name: "the post-link REGISTERED the component"
        run: |
          set -euo pipefail
          conda activate t
          # The ENV entry point, <prefix>/bin/isabelle or <prefix>/Scripts/isabelle.bat --
          # NOT <prefix>/isa/bin/isabelle, which is the distribution's own unix launcher.
          # That file ships on Windows too and Git-Bash calls it executable, so an `-x`
          # test picks it and Isabelle dies with "Failed to determine hardware and
          # operating system type!".  Dispatch on the OS, never on a file mode.
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            ISA="$CONDA_PREFIX/Scripts/isabelle.bat"
          else
            ISA="$CONDA_PREFIX/bin/isabelle"
          fi
          # `isabelle getenv` hands back a CYGWIN path on Windows (/cygdrive/c/...),
          # which Git-Bash cannot open -- it wants /c/...
          raw="$("$ISA" getenv -b ISABELLE_HOME_USER)"
          case "$raw" in
            /cygdrive/*) home="/${raw#/cygdrive/}" ;;
            *)           home="$raw" ;;
          esac
          comp="$home/etc/components"
          [ -f "$comp" ] || { echo "::error::no etc/components -- nothing registered"; exit 1; }
          echo "----- etc/components -----"; cat "$comp"
          grep -q 'isabelle-performant-ml' "$comp" \
            || { echo "::error::post-link did NOT register isabelle-performant-ml"; exit 1; }
          echo "  OK  registered"

      - name: "...and the session builds (linux only -- too slow on Windows)"
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          conda activate t
          # The ENV entry point, <prefix>/bin/isabelle or <prefix>/Scripts/isabelle.bat --
          # NOT <prefix>/isa/bin/isabelle, which is the distribution's own unix launcher.
          # That file ships on Windows too and Git-Bash calls it executable, so an `-x`
          # test picks it and Isabelle dies with "Failed to determine hardware and
          # operating system type!".  Dispatch on the OS, never on a file mode.
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            ISA="$CONDA_PREFIX/Scripts/isabelle.bat"
          else
            ISA="$CONDA_PREFIX/bin/isabelle"
          fi
          "$ISA" build -v Performant_Isabelle_ML Performant_Isabelle_HOL

      - name: "the pre-unlink UNREGISTERED it"
        run: |
          set -euo pipefail
          conda activate t
          # The ENV entry point, <prefix>/bin/isabelle or <prefix>/Scripts/isabelle.bat --
          # NOT <prefix>/isa/bin/isabelle, which is the distribution's own unix launcher.
          # That file ships on Windows too and Git-Bash calls it executable, so an `-x`
          # test picks it and Isabelle dies with "Failed to determine hardware and
          # operating system type!".  Dispatch on the OS, never on a file mode.
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            ISA="$CONDA_PREFIX/Scripts/isabelle.bat"
          else
            ISA="$CONDA_PREFIX/bin/isabelle"
          fi
          # `isabelle getenv` hands back a CYGWIN path on Windows (/cygdrive/c/...),
          # which Git-Bash cannot open -- it wants /c/...
          raw="$("$ISA" getenv -b ISABELLE_HOME_USER)"
          case "$raw" in
            /cygdrive/*) home="/${raw#/cygdrive/}" ;;
            *)           home="$raw" ;;
          esac
          comp="$home/etc/components"

          # --force removes ONLY this package.  A plain `conda remove` would take the
          # base `isabelle` with it, and isabelle's OWN pre-unlink deletes the whole
          # namespaced ISABELLE_HOME_USER -- so etc/components would vanish wholesale
          # and the check below would pass without proving anything.  That confound
          # made an earlier "PASS" vacuous.
          conda remove -y --force isabelle-performant-ml

          [ -f "$comp" ] || { echo "::error::etc/components vanished -- the removal took"
                              echo "::error::isabelle with it; this assertion is vacuous"
                              exit 1; }
          echo "----- etc/components after removal -----"; cat "$comp"
          ! grep -q 'isabelle-performant-ml' "$comp" \
            || { echo "::error::pre-unlink did NOT unregister isabelle-performant-ml"; exit 1; }
          echo "  OK  unregistered, and isabelle is still installed"
          "$ISA" version

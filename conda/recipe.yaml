schema_version: 1

# isabelle-performant-ml: the Performant_Isabelle_ML Isabelle session (mutable hash
# tables + the improved discrimination net `iNet`), as a conda add-on to the base
# `isabelle` package.  It ships source (ROOT + theories + ML), which Isabelle loads and
# builds into a heap on demand, PLUS one thing that cannot be source: the native library
# libperformant_isabelle_ml, prebuilt for all five supported platforms.
#
# Still `noarch: generic`, and deliberately so.  The five libraries live side by side in
# library/native/<platform>/, and library/thread_cpu.ML resolves <platform> from
# ML_PLATFORM at run time -- so ONE artifact is correct on every platform, and there is
# nothing for conda to select between.  Isabelle ships its own libsha1.so exactly like
# this.  The libraries are compiled by the `native` job of
# .github/workflows/release-conda.yml, each on a runner of its own architecture, and
# dropped into library/native/<target>/ before rattler-build is invoked.
#
# The recipe lives IN this repo, so the source is the repo itself (`source: path: ../`).
# The build script then copies exactly the files the session needs -- not Test/, not .git,
# not editor backups.
#
# The version is NOT duplicated here: CI reads ./VERSION and exports it.  Releasing is
# therefore "bump VERSION, tag" and nothing in this file changes.

context:
  version: ${{ env.get("ISA_COMPONENT_VERSION", default="0.0.0") }}

source:
  - path: ../
    # THE NATIVE LIBRARIES DEPEND ON THIS LINE.  For a local `path` source rattler-build
    # applies the repo's .gitignore by default -- "By default, all files in the local path
    # that are ignored by `git` are also ignored by Rattler-Build. You can disable this
    # behavior by setting `use_gitignore` to `false`.", and the reference's own example
    # annotates it `use_gitignore: false # note: defaults to true`
    # (https://rattler-build.prefix.dev/latest/reference/recipe_file/).  Our .gitignore
    # ignores `library/native/*/`, because those are build products and are never
    # committed -- so with the default the five libraries would be dropped from the source
    # copy and the package would build green with no binaries in it at all.
    #
    # The cost of switching it off is that .git/, editor leftovers and any build residue
    # under library/native/ (an object file or test binary from an aborted build) come
    # along too.  .git never reaches the package (the build script below copies only
    # named subtrees), the editor files are deleted below, and the build residue is
    # kept out at its source: library/native/build removes its objects, staging file
    # and test binary on every exit, and the build script below deletes any that
    # survived a kill -9.  (.gitignore names them too, but only to keep them out of
    # git; with use_gitignore: false it has no say over this copy.)
    use_gitignore: false

package:
  name: isabelle-performant-ml
  version: ${{ version }}

build:
  number: 0
  noarch: generic
  script:
    interpreter: bash
    content: |
      set -euo pipefail

      # ONE definition of where the component lives.  It used to be repeated inside the
      # generated hook scripts, where nothing checked the two against each other: a
      # divergence would build green, install green, and surface only as an unknown
      # session at use time.
      name=isabelle-performant-ml
      dest="$PREFIX/share/$name"

      mkdir -p "$dest"
      cp -a "$SRC_DIR/ROOT"                       "$dest/"
      cp -a "$SRC_DIR/Performant_Isabelle_ML.thy" "$dest/"
      cp -a "$SRC_DIR/HOL"                        "$dest/"
      cp -a "$SRC_DIR/library"                    "$dest/"
      cp -a "$SRC_DIR/contrib"                    "$dest/"
      # Editor leftovers must not ship.  `*~` alone was enough while .gitignore still
      # filtered the source copy; `use_gitignore: false` (see `source:` above) now lets
      # vim swap files through as well when the recipe is built from a working tree.
      find "$dest" \( -name '*~' -o -name '*.swp' -o -name '*.swo' \) -delete
      # Residue of an aborted library/native/build (the same three patterns .gitignore
      # names, path-anchored so nothing legitimate can match).
      rm -f "$dest"/library/native/*.o "$dest"/library/native/*.staged* "$dest"/library/native/test_thread_cpu

      test -f "$dest/ROOT"                     # a valid component has a ROOT

      # ---------------------------------------------------------------------------
      # The native library, for all five platforms.  These are NOT built here: they
      # come from the `native` job of .github/workflows/release-conda.yml, which
      # compiles and checks each on a runner of its own architecture and leaves it
      # in library/native/<target>/ for the `cp -a` of `library` above to pick up.
      #
      # This check is the reason a binary-less package cannot exist.  Everything that
      # could drop them -- `use_gitignore` reverting to its default, a renamed target,
      # a `native` leg quietly removed from the matrix -- fails here instead of
      # surfacing at a user's first Thread_CPU call as an error telling them to build
      # a library the package already ships.
      #
      # The target names are Poly/ML's ML_PLATFORM with any compact-object "_32"
      # stripped from the architecture; library/thread_cpu.ML computes exactly this
      # name to choose a directory.  macOS keeps the .so suffix -- that is the name
      # thread_cpu.ML asks for on every non-Windows platform, so it is not a mistake.
      # ---------------------------------------------------------------------------
      missing=0
      for t in arm64-darwin arm64-linux x86_64-darwin x86_64-linux; do
        f="$dest/library/native/$t/libperformant_isabelle_ml.so"
        if [ -f "$f" ]; then echo "  OK  library/native/$t"; else echo "MISSING $f" >&2; missing=1; fi
      done
      f="$dest/library/native/x86_64-windows/performant_isabelle_ml.dll"
      if [ -f "$f" ]; then echo "  OK  library/native/x86_64-windows"; else echo "MISSING $f" >&2; missing=1; fi
      if [ "$missing" -ne 0 ]; then
        echo "the package would ship without native libraries; build them with" >&2
        echo "library/native/build <target>, or let the release workflow's \`native\` job do it" >&2
        exit 1
      fi

      # ---------------------------------------------------------------------------
      # Link hooks.  BOTH the unix and the Windows set are written UNCONDITIONALLY.
      #
      # This is `noarch: generic`, so one artifact installs on every platform including
      # win-64 (and `isabelle` is built for Windows).  conda picks the hook by the RUNNING
      # platform -- Scripts/*.bat there, bin/*.sh elsewhere -- and returns success in
      # silence when the file is absent.  Shipping only .sh therefore means: installs
      # cleanly on Windows, shows up in `conda list`, and is never registered.
      #
      # Do NOT guard these with `case "$target_platform" in win-*)`: for noarch,
      # target_platform is `noarch`, so that branch can never match -- a fix that looks
      # applied and isn't.
      #
      # Every hook exits 0 unconditionally.  A nonzero post-link makes conda roll the
      # whole install back (verified on Windows); a failed registration merely surfaces
      # later as a clear "unknown session".
      # ---------------------------------------------------------------------------
      mkdir -p "$PREFIX/bin" "$PREFIX/Scripts"

      # printf, one argument per line -- NOT a heredoc.  A heredoc body would have to sit
      # at column 0 to keep its terminator recognisable, and column 0 ends this YAML block
      # scalar.  (The base recipe emits its hooks the same way, for the same reason.)
      for spec in post-link:-u pre-unlink:-x; do
        action=${spec%%:*}
        verb=${spec##*:}

        # \$PREFIX stays literal: conda expands it at link time, not now.
        printf '%s\n' \
          '#!/bin/bash' \
          "\"\$PREFIX/isa/bin/isabelle\" components $verb \"\$PREFIX/share/$name\" 2>/dev/null \\" \
          "  || echo \"warning: 'isabelle components $verb $name' failed; the session may be unavailable\"" \
          'exit 0' \
          > "$PREFIX/bin/.$name-$action.sh"
        chmod +x "$PREFIX/bin/.$name-$action.sh"

        # Windows.  CRLF (printf '%s\r\n'), and `exit /b 0` on every path.
        #
        # The path may NOT be handed over in native form: `isabelle components` parses it
        # with Path.explode, whose Path.check_elem rejects the characters `/\$:"'<>|?*`,
        # so `%PREFIX%\share\...` raises "Illegal character" -- and with the mandatory
        # `exit /b 0` that failure is invisible, i.e. exactly as broken as shipping no
        # .bat at all.  So convert to Cygwin form: strip `C:`, flip \ to /, prepend
        # /cygdrive/<drive>.  Pure batch substring/substitution, because cygpath.exe
        # printed NOTHING on a windows-latest runner (measured by this project's
        # preunlink-probe) and PowerShell would need quoting that cannot survive here.
        #
        # All of the above is VERIFIED on a real windows-latest runner (isabelle-packaging-ci
        # component-win-hooks-probe, run 29637825807), including a prefix containing spaces
        # and one on a non-C: drive.  The drive letter needs NO lowercasing: Isabelle accepts
        # /cygdrive/C/... and lowercases it itself when writing etc/components, while the
        # native form fails exactly as described above ('Illegal character ":"').
        #
        # The `getenv -b ISABELLE_HOME` line below is a THROWAWAY WARM-UP, and it is the
        # difference between this hook working and silently doing nothing.  Cygwin heals
        # itself on the FIRST isabelle call (getsettings -> Setup.classpath -> cygwin_init),
        # but that call's Java classpath is computed before the heal completes -- so the
        # first invocation is precisely the one that cannot run a Scala tool, and
        # `components` IS a Scala tool.  Measured on a cold prefix:
        #     Error: Could not find or load main class isabelle.Components
        # A bash-only subcommand succeeds on that first call, so it absorbs the cold start.
        # Both hooks need it: install-then-immediately-remove leaves pre-unlink cold too.
        # Its exit status is deliberately ignored, and `call` does not propagate failure into
        # the script's exit status, so `exit /b 0` still holds and conda cannot roll back.
        #
        # This is why the base package's own smoke tests never caught it: they use `version`
        # and `getenv`, which are bash-only and work on a cold prefix.
        printf '%s\r\n' \
          '@echo off' \
          "set \"COMP=%PREFIX%\\share\\$name\"" \
          'set "DL=%COMP:~0,1%"' \
          'set "REST=%COMP:~2%"' \
          'set "REST=%REST:\=/%"' \
          'set "CYG=/cygdrive/%DL%%REST%"' \
          'call "%PREFIX%\isa\bin\isabelle.bat" getenv -b ISABELLE_HOME >nul 2>&1' \
          "call \"%PREFIX%\\isa\\bin\\isabelle.bat\" components $verb \"%CYG%\" >nul 2>&1" \
          'exit /b 0' \
          > "$PREFIX/Scripts/.$name-$action.bat"
      done

      # The hooks reference the install path as a literal; assert it still equals $dest.
      grep -qF "share/$name" "$PREFIX/bin/.$name-post-link.sh"
      test "$dest" = "$PREFIX/share/$name"

requirements:
  run:
    # Bounded to the Isabelle SERIES this session is written against.  The base package
    # keeps a constant name at a per-release version (Isabelle2025-2 -> 2025.2), so
    # without a bound conda's newest-wins resolution pairs this component with a future
    # Isabelle it was never built for: it installs cleanly, registers, and then fails in
    # `isabelle build` on Isabelle/ML API drift.  Bumping this bound is part of porting to
    # a new series -- the same commit that touches the .thy/.ML sources.
    #
    # Deliberately NOT derived from ISA_COMPONENT_VERSION: that is this COMPONENT's own
    # semver (0.1.0), a different axis entirely.
    - isabelle >=2025.2,<2025.3

about:
  homepage: https://github.com/xqyww123/Performant_Isabelle_ML
  summary: "Performant Isabelle/ML: hash tables, the iNet discrimination net, a race engine, accounted and thread-CPU timeouts, and Poly/ML's Foreign"
  description: |
    The Performant_Isabelle_ML and Performant_Isabelle_HOL sessions, packaged as a
    conda add-on to the `isabelle` distribution.  Ships the sources and the prebuilt
    thread-CPU shim for every supported platform, and registers itself as an Isabelle
    component; heaps are built on demand.
  license: BSD-3-Clause
  repository: https://github.com/xqyww123/Performant_Isabelle_ML
